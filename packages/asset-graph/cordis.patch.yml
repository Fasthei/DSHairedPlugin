# dsh-redteam-asset-graph 的 bundle patch。
#
# 这个文件是「装了就能用」的钩子：`dsh plugin --profile <name> add dsh-redteam-asset-graph`
# 会把包装进 profile 的 node_modules，随后 `reconcilePlugins` 发现本包声明了
# dsh.bundle.patch，就把它并入 dsh.profile.bundles 层栈——插行由此生效，无需手工编辑配置。
#
# 组合顺序（官方 dsh README）：空根 → 各 bundle 的 patch → profile 的 cordis.patch.yml
# → $DSH_HOME/cordis.patch.yml → --patch 覆盖层。
#
# 语义提醒：patch 条目是 @deepseek-ai/cordis-plugin-include 的 PatchOptions。
# 带 id 的条目是「改某行配置」；**只有 insert 且不带 id 才是往根列表追加新行**（下面就是）。
- insert:
    # 宿主半边：注册 asset_record / asset_query / asset_remove 三个模型工具，
    # 并提供面板用的 JSON-RPC 端点 /dsh-redteam-asset-graph/rpc。
    # 名字即包名，由 profile 的 node_modules 解析。
    - id: redteam-asset-graph
      name: 'dsh-redteam-asset-graph'
